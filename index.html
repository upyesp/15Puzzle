<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f1117">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="manifest" href="./manifest.json">
  <!-- iOS / Safari PWA support -->
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="15 Puzzle">
  <title>15 Puzzle</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e4e6ed;
      --muted: #8b8fa3;
      --accent: #6c8cff;
      --tile-bg: #252836;
      --tile-hover: #2f3347;
      --tile-number: #e8ebf5;
      --win-gold: #ffd166;
      --gap: 6px;
      --radius: 10px;
      /* Slide animation. Want it slower/sooner? Tweak these two. */
      --slide-duration: 0.35s;
      --slide-easing: cubic-bezier(0.22, 1, 0.36, 1);
      /* The auto-solve plays moves back-to-back with a snappier slide. */
      --solve-duration: 0.18s;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 20px;
      width: min(100%, 380px);
    }

    .stat {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.25rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }

    .stat-value.gold {
      color: var(--win-gold);
    }

    /* Board */
    .board-wrapper {
      position: relative;
      width: min(85vw, 380px);
      aspect-ratio: 1 / 1;
      margin-bottom: 24px;
    }

    .board {
      position: relative;
      width: 100%;
      height: 100%;
      padding: var(--gap);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
    }

    /*
      Persistent tile elements (one per number) positioned absolutely.
      The outer .tile-slot owns the position + slide transition (transform: translate).
      The inner .tile owns the press/hover feedback (transform: scale).
      Keeping them separate means the two transforms never fight each other.
    */
    .tile-slot {
      position: absolute;
      left: 0;
      top: 0;
      transition: transform var(--slide-duration) var(--slide-easing);
      will-change: transform;
    }

    .tile-slot.no-anim {
      transition: none;
    }

    /* While the solver is playing the board, slides use the faster solve pace. */
    .board.solving .tile-slot {
      transition-duration: var(--solve-duration);
    }

    .tile {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2.16rem, 9vw, 3.6rem);
      font-weight: 700;
      border-radius: var(--radius);
      background: var(--tile-bg);
      color: var(--tile-number);
      cursor: pointer;
      transition: transform 0.12s ease, background 0.12s ease;
      border: 1px solid transparent;
      -webkit-tap-highlight-color: transparent;
      /* Ensures taps register reliably and disables the ~300ms double-tap-zoom delay. */
      touch-action: manipulation;
    }

    .tile:hover {
      background: var(--tile-hover);
      transform: scale(1.03);
    }

    .tile:active {
      transform: scale(0.95);
    }

    /* Win overlay */
    .win-overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 17, 23, 0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-radius: calc(var(--radius) + 4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      z-index: 10;
    }

    .win-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .win-icon {
      font-size: 3rem;
      margin-bottom: 8px;
    }

    .win-text {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--win-gold);
    }

    .win-sub {
      color: var(--muted);
      margin-top: 4px;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      width: min(100%, 380px);
    }

    button {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: default; }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.15); }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover { background: var(--tile-hover); }

    /* Personal best animation */
    @keyframes pulse-gold {
      0%   { box-shadow: 0 0 0 0 rgba(255, 209, 102, 0.4); }
      70%  { box-shadow: 0 0 0 12px rgba(255, 209, 102, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 209, 102, 0); }
    }

    .stat-value.new-best {
      animation: pulse-gold 1s ease-out;
      color: var(--win-gold) !important;
    }
  </style>
</head>
<body>
  <h1>15 Puzzle</h1>
  <p class="subtitle">Slide tiles to order them 1–15</p>

  <div class="stats">
    <div class="stat">
      <div class="stat-label">Moves</div>
      <div class="stat-value" id="moves">0</div>
    </div>
    <div class="stat">
      <div class="stat-label">Best Moves</div>
      <div class="stat-value gold" id="best">—</div>
    </div>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board"></div>
    <div class="win-overlay" id="overlay">
      <div class="win-icon">&#x1F3C6;</div>
      <div class="win-text">Solved!</div>
      <div class="win-sub" id="win-info"></div>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-primary" onclick="newGame()">New Game</button>
    <button class="btn-secondary" id="solve-btn" onclick="solveGame()">Solve</button>
    <button class="btn-secondary" onclick="resetBest()">Reset Best</button>
  </div>

  <script>
    (() => {
      const SIZE = 4;
      const TOTAL = SIZE * SIZE;

      // --- State ---
      let tiles = [];        // flat array, 0 = empty; tiles[i] = number at position i
      let moves = 0;
      let won = false;
      let solving = false;   // the auto-solve animation is running
      let solveTimer = null;

      const boardEl   = document.getElementById('board');
      const movesEl   = document.getElementById('moves');
      const bestEl    = document.getElementById('best');
      const overlayEl = document.getElementById('overlay');
      const winInfoEl = document.getElementById('win-info');
      const solveBtn  = document.getElementById('solve-btn');

      // Persistent tile elements keyed by number (1..15). Never recreated during play.
      const slotByNumber = {};

      // --- Persistence ---
      function getBest() {
        return JSON.parse(localStorage.getItem('puzzle15-best') || 'null');
      }

      function setBest(moveCount) {
        localStorage.setItem('puzzle15-best', JSON.stringify({ moves: moveCount }));
      }

      function renderBest() {
        const b = getBest();
        bestEl.textContent = b ? `${b.moves}` : '—';
      }

      // --- Sound: a brief knock when a tile reaches its destination ---
      // Synthesized with the Web Audio API (no assets, works offline). The
      // context is created lazily on the first user gesture -- browsers keep
      // audio muted until then -- and any failure is a silent no-op.
      let audioCtx = null;
      let noiseBuffer = null;

      function ensureAudio() {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
          // Half a second of white noise, reused for every slide.
          noiseBuffer = audioCtx.createBuffer(1, Math.floor(audioCtx.sampleRate * 0.5), audioCtx.sampleRate);
          const data = noiseBuffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
      }

      function playSlideSound() {
        if (!audioCtx || audioCtx.state !== 'running' || !noiseBuffer) return;
        const t = audioCtx.currentTime;
        const src = audioCtx.createBufferSource();
        src.buffer = noiseBuffer;
        // A bandpass around 2.5-3.5kHz reads as an airy "shh" rather than
        // static; a little jitter keeps repeats from sounding mechanical.
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 2500 + Math.random() * 1000;
        filter.Q.value = 0.8;
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.16, t + 0.005);   // fast attack
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.065); // brief knock
        src.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        src.start(t);
        src.stop(t + 0.1);
      }

      // The knock lands when the tile ARRIVES, not when it departs, so it
      // reads as the tile hitting its neighbor or the wall. The delay comes
      // from the slot's actual transition duration, which the solve animation
      // shortens dynamically (normal play: 350ms; solve: ~110-180ms).
      function playSlideArrivalSound(slot) {
        const seconds = parseFloat(getComputedStyle(slot).transitionDuration) || 0;
        setTimeout(playSlideSound, Math.max(0, seconds * 1000));
      }

      // --- Geometry ---
      // Tiles are absolutely positioned. We measure the board and compute each
      // tile's translate() from its grid index, so layout stays responsive.
      function getMetrics() {
        const styles = getComputedStyle(boardEl);
        const gap = parseFloat(styles.getPropertyValue('--gap')) || 6;
        const padding = gap;                              // board padding == --gap
        const clientW = boardEl.clientWidth;              // includes padding, excludes border
        const contentW = clientW - 2 * padding;
        const cell = (contentW - (SIZE - 1) * gap) / SIZE;
        return { gap, padding, cell };
      }

      function cellToXY(index) {
        const { gap, padding, cell } = getMetrics();
        const row = Math.floor(index / SIZE);
        const col = index % SIZE;
        return {
          x: padding + col * (cell + gap),
          y: padding + row * (cell + gap),
          cell
        };
      }

      function positionTile(number, animate) {
        const slot = slotByNumber[number];
        if (!slot) return;
        // Every animated slide "knocks" when the tile arrives -- human moves
        // and auto-solve alike; instant re-layouts stay silent.
        if (animate) playSlideArrivalSound(slot);
        const idx = tiles.indexOf(number);
        const { x, y, cell } = cellToXY(idx);

        if (!animate) {
          // Disable transition, apply, force a reflow, then re-enable so the
          // jump is instantaneous (used on new game / resize) while real moves slide.
          slot.classList.add('no-anim');
        }

        slot.style.width = cell + 'px';
        slot.style.height = cell + 'px';
        slot.style.transform = `translate(${x}px, ${y}px)`;

        if (!animate) {
          void slot.offsetWidth;             // flush layout
          slot.classList.remove('no-anim');
        }
      }

      function layoutAll(animate) {
        for (let n = 1; n < TOTAL; n++) positionTile(n, animate);
      }

      // --- Board build (once) ---
      function buildBoard() {
        boardEl.innerHTML = '';
        for (let n = 1; n < TOTAL; n++) {
          const slot = document.createElement('div');
          slot.className = 'tile-slot';

          const tile = document.createElement('div');
          tile.className = 'tile';
          tile.textContent = n;
          // A single, unified input handler. No touchend/click duplication, and
          // touch-action: manipulation on the tile makes the tap register reliably.
          tile.addEventListener('click', () => handleClick(n));

          slot.appendChild(tile);
          boardEl.appendChild(slot);
          slotByNumber[n] = slot;
        }
      }

      function handleClick(number) {
        if (won || solving) return;
        ensureAudio();          // first interaction unlocks the audio context
        const idx = tiles.indexOf(number);
        const emptyIdx = tiles.indexOf(0);
        if (!isAdjacent(idx, emptyIdx)) return;

        // Swap in the model, then animate just the one tile that moved.
        [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
        moves++;
        movesEl.textContent = moves;

        positionTile(number, true);

        if (checkWin()) handleWin();
      }

      function isAdjacent(a, b) {
        const rowA = Math.floor(a / SIZE), colA = a % SIZE;
        const rowB = Math.floor(b / SIZE), colB = b % SIZE;
        return (Math.abs(rowA - rowB) + Math.abs(colA - colB)) === 1;
      }

      // --- Win check ---
      function checkWin() {
        for (let i = 0; i < TOTAL - 1; i++) {
          if (tiles[i] !== i + 1) return false;
        }
        return true;
      }

      function handleWin() {
        won = true;
        winInfoEl.textContent = `${moves} moves`;

        let isNewBest = false;
        const prev = getBest();
        if (!prev || moves < prev.moves) {
          setBest(moves);
          isNewBest = true;
        }
        renderBest();
        if (isNewBest) {
          bestEl.classList.add('new-best');
          setTimeout(() => bestEl.classList.remove('new-best'), 1200);
        }

        // Let the final tile slide home before the overlay fades in.
        setTimeout(() => overlayEl.classList.add('show'), 260);
      }

      // --- Shuffling ---
      function getNeighbors(idx) {
        const row = Math.floor(idx / SIZE);
        const col = idx % SIZE;
        const n = [];
        if (row > 0) n.push(idx - SIZE);
        if (row < SIZE - 1) n.push(idx + SIZE);
        if (col > 0) n.push(idx - 1);
        if (col < SIZE - 1) n.push(idx + 1);
        return n;
      }

      function shuffle() {
        // Start solved, then perform random valid moves to guarantee solvability.
        tiles = [];
        for (let i = 1; i < TOTAL; i++) tiles.push(i);
        tiles.push(0);

        let emptyIdx = TOTAL - 1;
        let lastDir = -1;

        // More moves for a better shuffle on mobile
        const numMoves = isMobile() ? 200 : 150;

        for (let i = 0; i < numMoves; i++) {
          const neighbors = getNeighbors(emptyIdx);
          const filtered = neighbors.filter(n => n !== lastDir);
          const pick = filtered[Math.floor(Math.random() * filtered.length)];
          [tiles[emptyIdx], tiles[pick]] = [tiles[pick], tiles[emptyIdx]];
          lastDir = emptyIdx;
          emptyIdx = pick;
        }

        // Second pass: also avoid undoing the last move to ensure good mixing
        for (let i = 0; i < numMoves / 2; i++) {
          const neighbors = getNeighbors(emptyIdx);
          const filtered = neighbors.filter(n => n !== lastDir);
          const pick = filtered[Math.floor(Math.random() * filtered.length)];
          [tiles[emptyIdx], tiles[pick]] = [tiles[pick], tiles[emptyIdx]];
          lastDir = emptyIdx;
          emptyIdx = pick;
        }
      }

      function isMobile() {
        return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
      }

      // --- Solver (weighted IDA*: walking distance + Manhattan/linear conflicts) ---
      // Computes a near-optimal sequence of slides from any position the game
      // can produce. Optimal (unweighted) IDA* needs tens of seconds in JS on
      // typical shuffles (~45-55 optimal moves); weighting f by W keeps the
      // returned solution within 2x of optimal (usually just a few moves
      // longer) while the walking-distance table + weight prune the search
      // down to milliseconds.
      const SOLVE_WEIGHT = 2;

      const GOAL_ROW = new Array(TOTAL);
      const GOAL_COL = new Array(TOTAL);
      for (let t = 1; t < TOTAL; t++) {
        GOAL_ROW[t] = Math.floor((t - 1) / SIZE);
        GOAL_COL[t] = (t - 1) % SIZE;
      }

      const FOUND = -1;

      // Base-5 digits pack a 4x4 count matrix + blank axis position into a number.
      const P5 = [1, 5, 25, 125, 625, 3125, 15625, 78125, 390625, 1953125,
                  9765625, 48828125, 244140625, 1220703125, 6103515625,
                  30517578125, 152587890625];

      // Blank-move neighborhoods, precomputed once for the search hot path.
      const NBRS = [];
      for (let i = 0; i < TOTAL; i++) NBRS.push(getNeighbors(i));

      // Longest strictly increasing subsequence; lists here have ≤ 4 entries.
      function lisLength(seq) {
        const dp = [1, 1, 1, 1];
        let best = 0;
        for (let i = 0; i < seq.length; i++) {
          for (let j = 0; j < i; j++) {
            if (seq[j] < seq[i] && dp[j] + 1 > dp[i]) dp[i] = dp[j] + 1;
          }
          if (dp[i] > best) best = dp[i];
        }
        return best;
      }

      // Manhattan distance plus linear conflicts (tiles sitting in their goal
      // row/column but mutually reversed need extra detours). The LIS-based
      // conflict count keeps this component admissible.
      function mdAndConflicts(pos) {
        let h = 0;
        for (let i = 0; i < TOTAL; i++) {
          const t = pos[i];
          if (t === 0) continue;
          h += Math.abs(Math.floor(i / SIZE) - GOAL_ROW[t]) + Math.abs((i % SIZE) - GOAL_COL[t]);
        }
        for (let r = 0; r < SIZE; r++) {
          const goals = [];
          for (let i = r * SIZE; i < (r + 1) * SIZE; i++) {
            const t = pos[i];
            if (t !== 0 && GOAL_ROW[t] === r) goals.push(GOAL_COL[t]);
          }
          if (goals.length > 1) h += 2 * (goals.length - lisLength(goals));
        }
        for (let c = 0; c < SIZE; c++) {
          const goals = [];
          for (let i = c; i < TOTAL; i += SIZE) {
            const t = pos[i];
            if (t !== 0 && GOAL_COL[t] === c) goals.push(GOAL_ROW[t]);
          }
          if (goals.length > 1) h += 2 * (goals.length - lisLength(goals));
        }
        return h;
      }

      // Walking distance: a BFS table over row-membership states, where the
      // blank counts as a tile that belongs in the last row. dist[state] is
      // the minimum number of vertical blank moves needed to reach the goal
      // arrangement. One table serves both axes by symmetry, so
      //   walkDistance = vertical + horizontal
      // is admissible (every move is exactly one of the two kinds), and it
      // prunes far harder than Manhattan distance on scrambled boards.
      const wdTable = (() => {
        const start = new Uint8Array(17);
        for (let i = 0; i < SIZE; i++) start[i * SIZE + i] = SIZE;
        start[16] = SIZE - 1;                    // blank's goal: last row
        const key = st => {
          let k = 0;
          for (let i = 0; i < 17; i++) k += st[i] * P5[i];
          return k;
        };
        const dist = new Map();
        dist.set(key(start), 0);
        let frontier = [start];
        let d = 0;
        while (frontier.length) {
          d++;
          const next = [];
          for (const st of frontier) {
            const b = st[16];
            for (let nb = b - 1; nb <= b + 1; nb += 2) {
              if (nb < 0 || nb >= SIZE) continue;
              for (let g = 0; g < SIZE; g++) {   // move a goal-row-g tile up/down
                if (st[nb * SIZE + g] === 0) continue;
                const ns = st.slice();
                ns[nb * SIZE + g]--;
                ns[b * SIZE + g]++;
                ns[16] = nb;
                const k = key(ns);
                if (!dist.has(k)) { dist.set(k, d); next.push(ns); }
              }
            }
          }
          frontier = next;
        }
        return dist;
      })();

      function walkDistance(pos) {
        const rows = new Uint8Array(17);
        const cols = new Uint8Array(17);
        let blank = 0;
        for (let i = 0; i < TOTAL; i++) {
          const t = pos[i];
          if (t === 0) { blank = i; continue; }
          rows[Math.floor(i / SIZE) * SIZE + GOAL_ROW[t]]++;
          cols[(i % SIZE) * SIZE + GOAL_COL[t]]++;
        }
        rows[16] = Math.floor(blank / SIZE);
        cols[16] = blank % SIZE;
        let kv = 0;
        for (let i = 0; i < 17; i++) kv += rows[i] * P5[i];
        let kh = 0;
        for (let i = 0; i < 17; i++) kh += cols[i] * P5[i];
        // The ?? fallback is unreachable for real boards; it just keeps the
        // heuristic numeric if a lookup ever missed.
        return (wdTable.get(kv) ?? 0) + (wdTable.get(kh) ?? 0);
      }

      function heuristic(pos) {
        const md = mdAndConflicts(pos);
        const wd = walkDistance(pos);
        return md > wd ? md : wd;
      }

      // Returns a near-optimal list of tile numbers to slide into the blank,
      // in order (length ≤ SOLVE_WEIGHT × optimal), or [] when already
      // solved. `startPos` is not mutated.
      function computeSolution(startPos) {
        const pos = startPos.slice();
        const path = [];
        const h0 = heuristic(pos);
        if (h0 === 0) return [];

        function search(g, bound, blank, prevBlank) {
          const h = heuristic(pos);
          if (h === 0) return FOUND;
          const f = g + SOLVE_WEIGHT * h;
          if (f > bound) return f;

          let min = Infinity;
          for (const nb of NBRS[blank]) {
            if (nb === prevBlank) continue;
            const tile = pos[nb];
            pos[blank] = tile;
            pos[nb] = 0;
            path.push(tile);
            const t = search(g + 1, bound, nb, blank);
            if (t === FOUND) return FOUND;
            if (t < min) min = t;
            path.pop();
            pos[nb] = tile;
            pos[blank] = 0;
          }
          return min;
        }

        let bound = SOLVE_WEIGHT * h0;
        while (true) {
          const t = search(0, bound, pos.indexOf(0), -1);
          if (t === FOUND) return path.slice();
          if (t === Infinity) return null; // unreachable: game positions are always solvable
          bound = t;
        }
      }

      // --- Resize: keep tiles aligned without animating the reflow ---
      let resizeRaf = null;
      function onResize() {
        if (resizeRaf) cancelAnimationFrame(resizeRaf);
        resizeRaf = requestAnimationFrame(() => layoutAll(false));
      }

      // --- Solve button ---
      // Plays the board out from its current position, one animated slide per
      // step. The attempt is voided: on completion the move counter resets to
      // zero and the best record is deliberately never touched.
      const SOLVE_STEP_MS = 200;

      function cancelSolve() {
        if (!solving) return;
        clearTimeout(solveTimer);
        solving = false;
        solveTimer = null;
        boardEl.classList.remove('solving');
        boardEl.style.removeProperty('--solve-duration');
        solveBtn.disabled = false;
        solveBtn.textContent = 'Solve';
      }

      window.solveGame = function () {
        if (won || solving) return;
        ensureAudio();          // unlock on this gesture so the later steps can play
        solving = true;
        boardEl.classList.add('solving');
        solveBtn.disabled = true;
        solveBtn.textContent = 'Solving…';

        // Defer the search a tick so the button state paints first.
        setTimeout(() => {
          if (!solving) return;              // cancelled meanwhile (new game)
          const solution = computeSolution(tiles);
          if (solution === null || solution.length === 0) { cancelSolve(); return; }

          // Long solutions step a little faster so the show stays ~12s max;
          // each slide still finishes before the next step begins.
          const stepMs = Math.max(120, Math.min(SOLVE_STEP_MS, Math.round(12000 / solution.length)));
          boardEl.style.setProperty('--solve-duration', Math.round(stepMs * 0.9) + 'ms');

          let i = 0;
          const step = () => {
            const number = solution[i++];
            const idx = tiles.indexOf(number);
            const emptyIdx = tiles.indexOf(0);
            [tiles[idx], tiles[emptyIdx]] = [tiles[emptyIdx], tiles[idx]];
            positionTile(number, true);

            if (i < solution.length) {
              solveTimer = setTimeout(step, stepMs);
            } else {
              cancelSolve();
              moves = 0;
              movesEl.textContent = '0';
            }
          };
          step();
        }, 30);
      };

      // --- New game ---
      window.newGame = function () {
        cancelSolve();
        won = false;
        moves = 0;
        movesEl.textContent = '0';
        overlayEl.classList.remove('show');
        shuffle();
        layoutAll(false);
      };

      window.resetBest = function () {
        localStorage.removeItem('puzzle15-best');
        renderBest();
      };

      // --- Init ---
      buildBoard();
      renderBest();
      newGame();
      window.addEventListener('resize', onResize);

      // --- PWA: register the service worker for offline support ---
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js').catch(() => {
            /* registration is best-effort; the game still works without it */
          });
        });
      }
    })();
  </script>
</body>
</html>
