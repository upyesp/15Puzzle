<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Single tile matching the puzzle's dark theme, nearly full-bleed -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="#252836"/>

  <!-- Subtle border to match tile styling -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="none" stroke="#2a2d3a" stroke-width="1.5"/>

  <!-- "15" number, sized so the digits nearly fill the tile width -->
  <text x="31.2" y="30.3" text-anchor="middle" dominant-baseline="central"
        font-family="'Segoe UI', system-ui, sans-serif" font-weight="700"
        font-size="51" fill="#e8ebf5">15</text>
</svg>
